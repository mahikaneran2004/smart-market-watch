name: CI

on:
  push:
    branches: [main, madhav]
  pull_request:
    branches: [main, madhav]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: utd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Apply Database Schema & Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/utd_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Backend Tests & Integration Suite
        working-directory: backend
        env:
          NODE_ENV: test
          RUN_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/utd_test?schema=public
          JWT_ACCESS_SECRET: testsecretaccesstokenmin32characterslong123
          JWT_REFRESH_SECRET: testsecretrefreshtokenmin32characterslong123
          MARKET_DATA_MODE: mock
        run: npm test



  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:8000
        run: npm run build
